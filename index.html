<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gigi OS 💜</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <!-- TOP BAR -->
        <div class="top-bar">

            <div class="system-name">
                💜 GIGI OS
            </div>

            <div class="system-status">
                SYSTEM ONLINE
            </div>

        </div>


        <!-- DESKTOP ICONS -->
        <div class="desktop-icons">

            <div class="desktop-icon" data-app="manual">
                <div class="icon">📖</div>
                <span>Gigi Manual</span>
            </div>

            <div class="desktop-icon" data-app="brain">
                <div class="icon">🧠</div>
                <span>Gigi Brain</span>
            </div>

            <div class="desktop-icon" data-app="warnings">
                <div class="icon">⚠️</div>
                <span>Warnings</span>
            </div>

            <div class="desktop-icon" data-app="bugs">
                <div class="icon">🐛</div>
                <span>Known Bugs</span>
            </div>

            <div class="desktop-icon" data-app="era">
                <div class="icon">🎵</div>
                <span>Current Era</span>
            </div>

            <div class="desktop-icon" data-app="achievements">
                <div class="icon">🏆</div>
                <span>Achievements</span>
            </div>

        </div>


        <!-- WELCOME WINDOW -->
        <div class="welcome-window">

            <div class="window-header">

                <span>
                    GIGI OS // SYSTEM
                </span>

                <div class="window-buttons">

                    <button class="window-minimize">
                        −
                    </button>

                    <button class="window-maximize">
                        □
                    </button>

                    <button class="window-close">
                        ×
                    </button>

                </div>

            </div>


            <div class="window-content">

                <div class="welcome-icon">
                    💜
                </div>

                <h1>
                    WELCOME TO GIGI OS
                </h1>

                <p>
                    Personal operating system for one extremely
                    chaotic human being.
                </p>


                <div class="status-box">

                    <span>●</span>

                    GIGI.EXE IS CURRENTLY RUNNING

                </div>


                <button class="start-button">
                    ENTER SYSTEM →
                </button>

            </div>

        </div>


        <!-- APP WINDOW -->
        <div id="appWindow" class="app-window hidden">

            <div class="app-window-header">

                <span id="appTitle">
                    GIGI OS // APPLICATION
                </span>

                <div class="window-buttons">

                    <button id="appMinimize">
                        −
                    </button>

                    <button id="appMaximize">
                        □
                    </button>

                    <button id="appClose">
                        ×
                    </button>

                </div>

            </div>


            <div id="appContent" class="app-content">

                <!-- CONTENT GENERATED BY JAVASCRIPT -->

            </div>

        </div>


        <!-- TASKBAR -->
        <div class="taskbar">

            <button class="start-menu">
                💜
            </button>

            <div class="taskbar-title">
                Gigi OS
            </div>

            <div class="clock">
                10:22 AM
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
