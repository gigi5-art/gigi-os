<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gigi OS 💜</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="desktop">

        <!-- Desktop Header -->
        <div class="top-bar">
            <div class="system-name">
                💜 GIGI OS
            </div>

            <div class="system-status">
                SYSTEM ONLINE
            </div>
        </div>


        <!-- Desktop Icons -->
        <div class="desktop-icons">

            <div class="desktop-icon">
                <div class="icon">📖</div>
                <span>Gigi Manual</span>
            </div>

            <div class="desktop-icon">
                <div class="icon">🧠</div>
                <span>Gigi Brain</span>
            </div>

            <div class="desktop-icon">
                <div class="icon">⚠️</div>
                <span>Warnings</span>
            </div>

            <div class="desktop-icon">
                <div class="icon">🐛</div>
                <span>Known Bugs</span>
            </div>

            <div class="desktop-icon">
                <div class="icon">🎵</div>
                <span>Current Era</span>
            </div>

            <div class="desktop-icon">
                <div class="icon">🏆</div>
                <span>Achievements</span>
            </div>

        </div>


        <!-- Welcome Window -->
        <div class="welcome-window">

            <div class="window-header">
                <span>GIGI OS // SYSTEM</span>

                <div class="window-buttons">
                    <button>−</button>
                    <button>□</button>
                    <button>×</button>
                </div>
            </div>

            <div class="window-content">

                <div class="welcome-icon">
                    💜
                </div>

                <h1>
                    WELCOME TO GIGI OS
                </h1>

                <p>
                    Personal operating system for one extremely
                    chaotic human being.
                </p>

                <div class="status-box">
                    <span>●</span>
                    GIGI.EXE IS CURRENTLY RUNNING
                </div>

                <button class="start-button">
                    ENTER SYSTEM →
                </button>

            </div>

        </div>


        <!-- Taskbar -->
        <div class="taskbar">

            <button class="start-menu">
                💜
            </button>

            <div class="taskbar-title">
                Gigi OS
            </div>

            <div class="clock">
                10:22 AM
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
